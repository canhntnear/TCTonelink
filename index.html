<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải ứng dụng</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f7;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 24px;
            color: #1d1d1f;
            margin-bottom: 12px;
        }
        p {
            color: #86868b;
            font-size: 15px;
            margin-bottom: 24px;
        }
        .btn {
            display: inline-block;
            background-color: #0071e3;
            color: white;
            padding: 14px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            margin: 8px;
        }
        .btn-android {
            background-color: #34a853;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Tải ứng dụng của chúng tôi</h1>
        <p id="status-text">Đang chuyển hướng bạn đến cửa hàng ứng dụng...</p>
        
        <!-- Các nút dự phòng nếu thiết bị không tự chuyển hướng -->
        <div id="fallback-buttons" style="display: none;">
            <a id="appstore-btn" href="https://apps.apple.com/app/idYOUR_APP_ID" class="btn">Tải trên App Store</a>
            <a id="playstore-btn" href="https://play.google.com/store/apps/details?id=YOUR_PACKAGE_NAME" class="btn btn-android">Tải trên Google Play</a>
        </div>
    </div>

    <script>
        // THAY BẰNG LINK ỨNG DỤNG THỰC TẾ CỦA BẠN TẠI ĐÂY
        const APP_STORE_URL = "https://apps.apple.com/app/idYOUR_APP_ID";
        const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=YOUR_PACKAGE_NAME";
        const WEBSITE_URL = "https://yourwebsite.com"; // Link dành cho máy tính (PC/Mac)

        function redirectUser() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // Kiểm tra iOS (iPhone, iPad, iPod)
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = APP_STORE_URL;
                return;
            }

            // Kiểm tra Android
            if (/android/i.test(userAgent)) {
                window.location.href = PLAY_STORE_URL;
                return;
            }

            // Nếu truy cập bằng máy tính (Desktop/Laptop)
            document.getElementById("status-text").innerText = "Vui lòng chọn hệ điều hành của bạn:";
            document.getElementById("fallback-buttons").style.display = "block";
        }

        // Tự động chạy khi mở link
        window.onload = redirectUser;
    </script>
</body>
</html>
