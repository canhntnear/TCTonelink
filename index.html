<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tải ứng dụng TCT GPS 2</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f6f9;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 40px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            max-width: 380px;
            width: 88%;
        }
        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            margin-bottom: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 22px;
            color: #1a1a1a;
            margin: 0 0 8px 0;
        }
        p {
            color: #666666;
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            color: #ffffff;
            transition: opacity 0.2s ease;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn-ios {
            background-color: #000000;
        }
        .btn-android {
            background-color: #01875f;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>TCT GPS 2</h1>
        <p id="status-text">Đang tự động chuyển hướng bạn đến cửa hàng ứng dụng...</p>
        
        <div id="fallback-buttons" class="btn-group" style="display: none;">
            <a id="appstore-btn" href="https://apps.apple.com/vn/app/tct-gps-2/id1462874097" class="btn btn-ios">
                Tải trên App Store (iOS)
            </a>
            <a id="playstore-btn" href="https://play.google.com/store/apps/details?id=vn.vietnamcnn.gpsmobile" class="btn btn-android">
                Tải trên Google Play (Android)
            </a>
        </div>
    </div>

    <script>
        // Đường link thực tế của bạn
        const APP_STORE_URL = "https://apps.apple.com/vn/app/tct-gps-2/id1462874097";
        const PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=vn.vietnamcnn.gpsmobile";

        function redirectUser() {
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;

            // Kiểm tra iOS (iPhone, iPad, iPod)
            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                window.location.href = APP_STORE_URL;
                return;
            }

            // Kiểm tra Android
            if (/android/i.test(userAgent)) {
                window.location.href = PLAY_STORE_URL;
                return;
            }

            // Dành cho máy tính (PC/Laptop) hoặc trình duyệt trong app bị chặn tự nhảy
            document.getElementById("status-text").innerText = "Vui lòng chọn hệ điều hành của thiết bị:";
            document.getElementById("fallback-buttons").style.display = "flex";
        }

        // Kích hoạt khi trang web tải xong
        window.onload = redirectUser;
    </script>
</body>
</html>
